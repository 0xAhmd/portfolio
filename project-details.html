<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Details - Ahmed Hesham</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/project-details.css">
</head>
<body>
    <!-- Navigation Header -->
    <header class="project-header">
        <div class="container">
            <nav class="project-nav">
                <a href="index.html" class="back-button">
                    <span>←</span> Back to Portfolio
                </a>
            </nav>
        </div>
    </header>

    <!-- Project Hero Section -->
    <section class="project-hero">
        <div class="container">
            <div class="project-hero-content">
                <h1 id="project-name" class="project-title">Project Name</h1>
                <p id="project-tagline" class="project-tagline">Brief tagline about the project</p>
            </div>
        </div>
    </section>

    <!-- Project Content -->
    <div class="project-detail-content">
        <div class="container">
            <!-- Project Overview -->
            <section class="project-section">
                <h2>Project Overview</h2>
                <div id="project-description" class="project-description">
                    <p>Detailed description of the project will appear here.</p>
                </div>
            </section>

            <!-- Project Image Gallery -->
            <section class="project-section">
                <h2>Visual Showcase</h2>
                <div id="project-gallery" class="project-gallery">
                    <div class="main-image">
                        <img id="main-project-image" src="" alt="Project Screenshot">
                    </div>
                    <div id="additional-images" class="image-grid">
                        <!-- Additional images will be inserted here -->
                    </div>
                </div>
            </section>

            <!-- What I Made Section -->
            <section class="project-section">
                <h2>What I Built</h2>
                <div id="project-contributions" class="contributions-grid">
                    <!-- Contributions will be inserted here -->
                </div>
            </section>

            <!-- Tools & Technologies -->
            <section class="project-section">
                <h2>Tools & Technologies</h2>
                <div id="project-tools" class="tools-container">
                    <!-- Tools will be inserted here -->
                </div>
            </section>

            <!-- Team Section -->
            <section class="project-section" id="team-section">
                <h2>Team Members</h2>
                <div id="project-team" class="team-grid">
                    <!-- Team members will be inserted here -->
                </div>
            </section>

            <!-- Project Links -->
            <section class="project-section" id="links-section">
                <h2>Project Links</h2>
                <div id="project-links" class="links-container">
                    <!-- Links will be inserted here -->
                </div>
            </section>

            <!-- Navigation -->
            <div class="project-navigation">
                <a href="#" id="prev-project" class="nav-button prev">
                    <span>←</span> Previous Project
                </a>
                <a href="index.html#projects" class="nav-button center">
                    All Projects
                </a>
                <a href="#" id="next-project" class="nav-button next">
                    Next Project <span>→</span>
                </a>
            </div>
        </div>
    </div>

    <script src="js/project-data.js"></script>
    <script src="js/project-details.js"></script>
</body>
</html>
